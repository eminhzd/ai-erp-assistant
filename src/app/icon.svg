<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid black background -->
  <rect width="32" height="32" rx="6" fill="#0A0A0A"/>
  
  <!-- Subtle inner frame -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5" fill="none" stroke="#2A2A2A" stroke-width="1"/>
  
  <!-- Central geometric core (AI node) -->
  <circle cx="16" cy="16" r="4.2" fill="#FFFFFF"/>
  
  <!-- Outer orbital ring -->
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#A3A3A3" stroke-width="1.4"/>
  
  <!-- Four data/ERP nodes -->
  <circle cx="16" cy="7.5" r="1.8" fill="#D4D4D4"/>
  <circle cx="16" cy="24.5" r="1.8" fill="#D4D4D4"/>
  <circle cx="7.5" cy="16" r="1.8" fill="#D4D4D4"/>
  <circle cx="24.5" cy="16" r="1.8" fill="#D4D4D4"/>
  
  <!-- Connecting lines (data flow) -->
  <line x1="16" y1="11.5" x2="16" y2="9.3" stroke="#A3A3A3" stroke-width="1.2"/>
  <line x1="16" y1="20.5" x2="16" y2="22.7" stroke="#A3A3A3" stroke-width="1.2"/>
  <line x1="11.5" y1="16" x2="9.3" y2="16" stroke="#A3A3A3" stroke-width="1.2"/>
  <line x1="20.5" y1="16" x2="22.7" y2="16" stroke="#A3A3A3" stroke-width="1.2"/>
  
  <!-- Subtle diagonal accents for depth -->
  <line x1="10.2" y1="10.2" x2="12.4" y2="12.4" stroke="#737373" stroke-width="1"/>
  <line x1="21.8" y1="10.2" x2="19.6" y2="12.4" stroke="#737373" stroke-width="1"/>
  <line x1="10.2" y1="21.8" x2="12.4" y2="19.6" stroke="#737373" stroke-width="1"/>
  <line x1="21.8" y1="21.8" x2="19.6" y2="19.6" stroke="#737373" stroke-width="1"/>
</svg>
